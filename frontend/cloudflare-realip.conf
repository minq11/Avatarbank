# Cloudflare 뒤에서 실제 클라이언트 IP 복원.
#
# 프록시(주황 구름)를 켜면 origin 이 보는 $remote_addr 은 Cloudflare 엣지 IP 다.
# 그대로 두면 레이트리밋(backend/app/rate_limit.py)이 전 세계 트래픽을 IP 몇 개로
# 묶어버려 사실상 무력화된다.
#
# 아래 대역에서 온 요청에 한해 CF-Connecting-IP 를 $remote_addr 로 채택한다.
# 대역 밖(= Cloudflare 를 우회한 직접 접속)에서 온 CF-Connecting-IP 는 무시되므로
# 헤더 위조로 레이트리밋을 넘길 수 없다.
#
# 목록 출처: https://www.cloudflare.com/ips/ (2026-08 기준)
# 갱신은 드물지만, 배포 후 origin 접속이 이상하면 이 목록부터 최신인지 확인할 것.

