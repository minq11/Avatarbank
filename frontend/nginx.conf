# 기본(HTTP) 서버 설정 — 이미지에 구워지는 값이다.
# 로컬 docker-compose 와, TLS 종단을 nginx 바깥(로드밸런서 등)에서 처리하는 환경용.
#
# Lightsail + Cloudflare 운영 배포는 nginx.prod.conf 를 이 파일 위에 마운트해서
# 443 을 직접 받는다. docker-compose.prod.yml 의 volumes 참고.

server {
    # IPv4 만 바인딩한다. 컨테이너 네트워크 네임스페이스에 IPv6 스택이 없으면
    # listen [::]:80 은 "Address family not supported by protocol" 로 기동에 실패한다.
    # Cloudflare 는 origin 에 A 레코드(IPv4)로 붙으므로 IPv6 리슨이 필요 없다.
    listen 80;
    server_name _;

    # Cloudflare 뒤가 아니면 no-op 이다 (엣지 대역에서 온 요청에만 적용).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    include /etc/nginx/snippets/app.conf;
}
