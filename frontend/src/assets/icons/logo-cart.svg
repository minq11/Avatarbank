<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <g transform="translate(-2, 4)">
  <!-- Cart basket body (symmetric around x=26) -->
  <path
    d="M14 20h24l-3 12H17L14 20z"
    fill="#0d9488"
    stroke="#0d9488"
    stroke-width="1"
    stroke-linejoin="round"
  />
  <!-- Cart handle - U-shape, symmetric -->
  <path
    d="M20 20V10Q20 8 26 8Q32 8 32 10V20"
    fill="none"
    stroke="#0d9488"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Eyes (symmetric: 26±4) -->
  <ellipse cx="22" cy="26" rx="3" ry="3.5" fill="#fff" />
  <ellipse cx="30" cy="26" rx="3" ry="3.5" fill="#fff" />
  <circle cx="22" cy="26" r="1.2" fill="#134e4a" />
  <circle cx="30" cy="26" r="1.2" fill="#134e4a" />
  </g>
</svg>
