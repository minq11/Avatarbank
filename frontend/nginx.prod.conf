# 운영(TLS) 서버 설정 — Lightsail + Cloudflare 프록시 구성용.
#
# Cloudflare SSL/TLS 모드는 반드시 "Full (strict)" 로 둔다.
#   - Flexible: 엣지~origin 구간이 평문이라 JWT 가 그대로 흐른다. 쓰지 말 것.
#   - Full:     origin 인증서를 검증하지 않아 중간자 공격을 막지 못한다.
#   - Full (strict): Cloudflare Origin CA 인증서를 검증한다. 이걸 쓴다.
#
# 인증서는 Cloudflare 대시보드 → SSL/TLS → Origin Server → Create Certificate 로
# 발급하고(유효기간 15년), 호스트의 ./certs 에 아래 이름으로 저장한 뒤
# docker-compose.prod.yml 이 /etc/nginx/certs 로 마운트한다.
#   certs/origin.pem  ← Origin Certificate
#   certs/origin.key  ← Private Key (chmod 600)
#
# 발급 절차와 방화벽 설정은 DEPLOY.md 참고.

# HTTP 로 들어온 요청은 HTTPS 로 넘긴다.
# Cloudflare 의 "Always Use HTTPS" 를 켜면 엣지에서 이미 처리되지만,
# 엣지를 우회한 직접 접속(IP 로 80 포트)까지 덮으려면 origin 에도 필요하다.
server {
    # IPv4 만 바인딩 (이유는 nginx.conf 주석 참고).
    listen 80;
    server_name _;

    # 헬스체크는 리다이렉트 전에 처리한다. 컨테이너 내부에서 TLS 를 거치지 않고
    # 살아있는지만 확인하면 되므로, Origin 인증서 검증 문제를 아예 만들지 않는다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # HSTS 는 일부러 여기 두지 않았다. 한 번 브라우저에 캐시되면 max-age 동안
    # 되돌릴 수 없어서, 오픈 직후에 켜면 도메인 설정을 손볼 여지가 사라진다.
    # 며칠 굴려보고 HTTPS 가 안정되면 Cloudflare 대시보드(SSL/TLS → Edge Certificates
    # → HSTS)에서 켤 것. DEPLOY.md 의 "오픈 후" 절 참고.

    include /etc/nginx/snippets/app.conf;
}
