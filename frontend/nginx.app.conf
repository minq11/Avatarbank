# AvatarClub 프론트 서버 공통 설정.
# nginx.conf(HTTP 전용) 와 nginx.prod.conf(TLS) 의 server 블록에서 include 한다.
# 두 진입점이 갈라져도 라우팅 규칙은 여기 한 곳만 고치면 되도록 분리했다.

root /usr/share/nginx/html;
index index.html;

# 업로드 이미지가 이 경로를 지난다. nginx 기본값 1m 이면 휴대폰 사진(3~8MB)이
# 백엔드에 닿기도 전에 413 으로 잘린다.
client_max_body_size 20m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

# 컨테이너 헬스체크 전용. SPA fallback 이나 TLS 를 타지 않고 즉시 200 을 준다.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
}

# ------------------------------------------------------------------
# API 프록시 — 프론트와 같은 오리진(/api/*)으로 백엔드를 노출한다.
# 덕분에 CORS·쿠키·구글 로그인 오리진 문제가 생기지 않는다.
#
# proxy_pass 끝의 슬래시가 핵심이다. 이게 없으면 /api 접두사가 그대로 붙어
# 백엔드로 넘어가고(/api/auth/login), 백엔드 라우트는 루트 기준(/auth/login)이라
# 전부 404 가 된다.
# ------------------------------------------------------------------
location /api/ {
    proxy_pass http://backend:8000/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr 은 cloudflare-realip.conf 가 CF-Connecting-IP 로 복원해 둔 값이다.
    # $proxy_add_x_forwarded_for 로 이어붙이면 Cloudflare 가 보낸 XFF 가 앞에 남아
    # 클라이언트가 위조한 값이 첫 자리에 올 수 있다. 덮어쓰는 쪽이 안전하다.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # fal 이미지 생성은 동기 호출이고 backend/app/fal_client.py 가 180초까지 기다린다.
    # nginx 기본 60초로는 생성이 끝나기 전에 504 가 난다.
    # 주의: Cloudflare 무료 플랜은 origin 응답을 100초까지만 기다리고 524 를 돌려준다.
    #      z-image/turbo 는 보통 10초 내라 여유가 있지만, 모델을 바꾸면 이 한계를 먼저 볼 것.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    proxy_buffering off;
}

# ------------------------------------------------------------------
# 정적 자산 — 파일명에 해시가 붙는 Vite 산출물이라 장기 캐시가 안전하다.
# ------------------------------------------------------------------
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
}

# ------------------------------------------------------------------
# SPA 라우팅 — /studio, /r/xxx 등 클라이언트 라우트는 index.html 로 넘긴다.
# index.html 자체는 캐시하면 배포 후 구버전이 남으므로 no-store.
# ------------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
